<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Progressive Web App</title>
    <meta name="msapplication-TileColor" content="#af0a1a">
    <meta name="theme-color" content="#ffffff">
    <link rel="shortcut icon" href="img/fav-16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="img/fav-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="img/fav-16.png">
    <link rel="apple-touch-icon" href="img/fav-57.png">
    <link rel="apple-touch-icon" sizes="114x114" href="img/fav-114.png">
    <link rel="apple-touch-icon" sizes="72x72" href="img/fav-72.png">
    <link rel="apple-touch-icon" sizes="144x144" href="img/fav-144.png">
    <link rel="manifest" href="pwa-manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <script type='text/javascript' src="js/main.js"></script>
</head>
<body>
    <div class="content">
<video style="width:100%;max-width:100%"
  autoplay
  muted            <!-- required by most browsers for autoplay -->
  loop
  playsinline      <!-- important for iOS / mobile to autoplay inline -->
  preload="auto"
  poster="poster.jpg"  <!-- optional: shown while loading -->
  width="1280" height="720"
  style="max-width:100%;height:auto;display:block;"
  aria-label="Decorative looping video"  <!-- or use proper captioning if content is meaningful -->
>
  <source src="Rc.webm" type="video/webm">
  <!-- optional fallback for browsers that don't support webm -->
  <source src="video.mp4" type="video/mp4">
  <!-- accessible fallback content -->
  Your browser does not support the video tag. You can <a href="video.webm">download the video</a>.
</video>
    </div>
</body>
</html>
